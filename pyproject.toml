[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "saddlebench"
version = "0.2.0"
description = "Standalone reference-matched, uncertainty-preserving saddle geometry scorer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "ase>=3.22", "huggingface_hub>=0.25"]
[project.scripts]
saddlebench = "saddlebench.public_entrypoint:main"
[tool.setuptools.packages.find]
include = ["saddlebench*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
